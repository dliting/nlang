# English tree. INHERIT pulls every shared setting from the base; the
# manual trees are fully translated and the specification tree is being
# seeded in batches, so docs/user_manual/translation-pending.txt is
# non-empty and the tree-parity pytest runs in pending mode (strict
# nav parity locks again once the list empties).
INHERIT: mkdocs.base.yml
site_name: NLang Documentation
docs_dir: user_manual/en
theme:
  language: en
  custom_dir: ../tools/nlang-docs/theme_override
nav:
  - Home: index.md
  - Getting Started:
      - What is NLang: getting-started/what-is-nlang.md
      - Installation and Layout: getting-started/install-layout.md
