# Chinese tree. INHERIT pulls every shared setting from the base; both
# the manual trees and the specification tree are fully translated, so
# docs/user_manual/translation-pending.txt is empty and the tree-parity
# pytest runs in strict mode (the two navs must list identical page
# paths; a page missing from one nav fails the gate even when
# translated).
INHERIT: mkdocs.base.yml
site_name: NLang中文文档
docs_dir: user_manual/zh
theme:
  language: zh
  custom_dir: ../tools/nlang-docs/theme_override
nav:
  - 主页: index.md
  - NLang入门:
      - NLang是什么: getting-started/what-is-nlang.md
      - 安装与布局: getting-started/install-layout.md
      - 五分钟上手: getting-started/first-program.md
      - 速览:
          - 类型与变量: getting-started/types-and-variables.md
          - 容器: getting-started/containers.md
          - 控制流: getting-started/control-flow.md
          - 类与继承: getting-started/classes-and-inheritance.md
          - 函数与模块: getting-started/function-features.md
      - 三种运行方式: getting-started/running.md
      - 在nide中调试: getting-started/debugging.md
      - 常见问题: getting-started/faq.md
      - 扩展NLang: getting-started/extending-nlang.md
      - 将NLang嵌入到其他程序中: getting-started/embedding-nlang.md
      - 下一步阅读: getting-started/further-reading.md
  - 命令行工具:
      - 概览: cli-tools/overview.md
      - nlang: cli-tools/nlang.md
      - ncc: cli-tools/ncc.md
      - nvm: cli-tools/nvm.md
      - ndb: cli-tools/ndb.md
      - ndisasm: cli-tools/ndisasm.md
  - 规范:
      - 概览: specification/index.md
      - 引言: specification/00-introduction.md
      - 词法结构: specification/01-lexical.md
      - 语法: specification/02-grammar.md
      - 程序结构与名称解析:
          - 概览: specification/03-program-structure/index.md
          - 声明: specification/03-program-structure/declarations.md
          - 包与导入查找: specification/03-program-structure/packages.md
      - 类型:
          - 概览: specification/04-types/index.md
          - 基本类型: specification/04-types/primitives.md
          - 字符串: specification/04-types/string.md
          - 类型强制转换: specification/04-types/casts.md
          - 枚举: specification/04-types/enum.md
          - 结构体: specification/04-types/struct.md
          - 类: specification/04-types/class.md
          - 接口: specification/04-types/interface.md
          - 数组: specification/04-types/array.md
          - Object与装箱: specification/04-types/object.md
          - 泛型: specification/04-types/generics.md
      - 表达式:
          - 概览: specification/05-expressions/index.md
          - 运算符: specification/05-expressions/operators.md
          - 集合初始化器: specification/05-expressions/initializers.md
      - 语句:
          - 概览: specification/06-statements/index.md
          - 控制流: specification/06-statements/control-flow.md
          - 循环: specification/06-statements/loops.md
      - 函数:
          - 概览: specification/07-functions/index.md
          - 参数与实参: specification/07-functions/parameters.md
          - 重载解析: specification/07-functions/overloads.md
          - 函数值与委托: specification/07-functions/function-values.md
          - 原生函数: specification/07-functions/native.md
      - 异常: specification/08-exceptions/index.md
      - 执行模型:
          - 概览: specification/09-execution-model/index.md
          - 生命周期与垃圾回收: specification/09-execution-model/memory.md
          - 程序的进入与退出: specification/09-execution-model/exit-codes.md
      - 并发:
          - 概览: specification/10-concurrency/index.md
          - 载体与并行: specification/10-concurrency/carriers.md
          - 挂起与调度限制: specification/10-concurrency/suspension.md
      - 标准库:
          - 库约定: specification/library/11-conventions.md
          - 集合: specification/library/12-collections.md
          - math包: specification/library/13-math.md
          - io包与流:
              - 概览: specification/library/14-io/index.md
              - ByteStream与FileStream: specification/library/14-io/streams.md
          - fs包: specification/library/15-fs.md
          - string方法: specification/library/16-string-methods.md
          - 并发类:
              - 概览: specification/library/17-concurrency-classes/index.md
              - thread包: specification/library/17-concurrency-classes/thread.md
              - Future: specification/library/17-concurrency-classes/future.md
              - Promise: specification/library/17-concurrency-classes/promise.md
              - Mutex: specification/library/17-concurrency-classes/mutex.md
              - Semaphore: specification/library/17-concurrency-classes/semaphore.md
              - ReentrantMutex: specification/library/17-concurrency-classes/reentrant-mutex.md
              - AtomicInt: specification/library/17-concurrency-classes/atomic.md
              - Channel: specification/library/17-concurrency-classes/channel.md
              - concurrent包: specification/library/17-concurrency-classes/concurrent.md
      - tensor包: specification/18-tensor.md
      - 库异常: specification/19-library-exceptions.md
      - .ncu单元映像: specification/20-ncu-unit-image.md
      - .npkg包档案: specification/21-npkg-package-archive.md
      - 原生应用二进制接口: specification/22-native-abi.md
  - 语言规格:
      - 命名约定: language-spec/naming-convention.md
      - 标准库:
          - tensor: language-spec/stdlib-tensor.md
          - 异常映射: language-spec/stdlib-exceptions.md
      - 参考:
          - 已知限制: language-spec/known-limitations.md
          - 常见错误消息: language-spec/common-errors.md
  - 库与集成:
      - 开发第三方库: libraries/developing-libraries.md
      - 集成NLang: libraries/integrating-nlang.md
      - 嵌入NLang: libraries/embedding-api.md
  - VM架构:
      - 概览: vm-architecture/overview.md
      - 核心:
          - 编译管线: vm-architecture/compilation-pipeline.md
          - 栈帧布局: vm-architecture/stack-frame-layout.md
          - 帧机与调度器: vm-architecture/frame-machine-and-scheduler.md
          - 堆架构: vm-architecture/heap-architecture.md
          - 字节码指令: vm-architecture/bytecode-instructions.md
          - 垃圾回收设计: vm-architecture/garbage-collection-design.md
      - 调试支持: vm-architecture/debugging.md
      - 模块序列化: vm-architecture/module-serialization.md
      - 库机制: vm-architecture/library-mechanism.md
      - 代码生成:
          - foreach降级: vm-architecture/foreach-statement-lowering.md
          - 初始化列表降级: vm-architecture/init-list-lowering.md
          - 二元表达式提升: vm-architecture/binary-expression-promotion.md
          - 标准库内建函数: vm-architecture/standard-library-intrinsics.md
          - 一等函数值: vm-architecture/first-class-function-values.md
      - 已知限制: vm-architecture/known-limitations.md
#The per-tree header link to the other tree's home page (rendered by
#theme_override main.html; its guard keeps absent keys inert).
extra:
  lang_switch_target: en
  lang_switch_label: English
