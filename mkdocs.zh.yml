# Chinese tree. INHERIT pulls every shared setting from the base; both
# trees are fully translated (see docs/translation-pending.txt, whose
# list is empty) and the tree-parity pytest runs in strict nav-parity
# mode: any new page must land in both trees and both navs in the same
# change.
INHERIT: mkdocs.base.yml
site_name: NLang 中文文档
docs_dir: docs/zh
theme:
  language: zh
  custom_dir: tools/nlang-docs/theme_override
nav:
  - 主页: index.md
  - NLang 入门:
      - NLang 是什么: getting-started/what-is-nolang.md
      - 安装与布局: getting-started/install-layout.md
      - 五分钟上手: getting-started/first-program.md
      - "速览: 类型与变量": getting-started/types-and-variables.md
      - "速览: 容器": getting-started/containers.md
      - "速览: 控制流": getting-started/control-flow.md
      - "速览: 类与继承": getting-started/classes-and-inheritance.md
      - "速览: 函数与模块": getting-started/function-features.md
      - 三种运行方式: getting-started/running.md
      - 在 nide 中调试: getting-started/debugging.md
      - 常见问题: getting-started/faq.md
      - 下一步阅读: getting-started/further-reading.md
  - 语言规格:
      - 概览: language-spec/overview.md
      - 命名约定: language-spec/naming-convention.md
      - 类型: language-spec/types.md
      - 类型语义: language-spec/type-semantics.md
      - 声明: language-spec/declarations.md
      - 内建泛型类: language-spec/builtin-generic-classes.md
      - 表达式: language-spec/expressions.md
      - 语句: language-spec/statements.md
      - 函数: language-spec/functions.md
      - 函数类型与委托: language-spec/function-types-and-delegates.md
      - 标准库: language-spec/standard-library.md
      - 内存管理: language-spec/memory-management.md
      - 退出码约定: language-spec/exit-code-convention.md
      - 已知限制: language-spec/known-limitations.md
  - VM 架构:
      - 概览: vm-architecture/overview.md
      - 编译管线: vm-architecture/compilation-pipeline.md
      - 栈帧布局: vm-architecture/stack-frame-layout.md
      - 堆架构: vm-architecture/heap-architecture.md
      - 字节码指令: vm-architecture/bytecode-instructions.md
      - 垃圾回收设计: vm-architecture/garbage-collection-design.md
      - 调试支持: vm-architecture/debugging.md
      - 模块序列化: vm-architecture/module-serialization.md
      - foreach 降级: vm-architecture/foreach-statement-lowering.md
      - 初始化列表降级: vm-architecture/init-list-lowering.md
      - 二元表达式提升: vm-architecture/binary-expression-promotion.md
      - 标准库内建函数: vm-architecture/standard-library-intrinsics.md
      - 一等函数值: vm-architecture/first-class-function-values.md
      - 已知限制: vm-architecture/known-limitations.md
#The per-tree header link to the other tree's home page (rendered by
#theme_override main.html; its guard keeps absent keys inert).
extra:
  lang_switch_target: en
  lang_switch_label: English
