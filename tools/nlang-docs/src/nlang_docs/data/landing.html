<!DOCTYPE html>
<!-- Root landing page for the bilingual docs site (copied by the
     CMake docs target to site/index.html). Both entry links are
     always visible; the inline script additionally jumps once to the
     reader's language -- it runs before first paint and is fully
     local, so it works over file:// in the nide help viewer too.
     A "?stay" query bypasses the jump for language picking. -->
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NLang Documentation</title>
<script>
if (!/[?&]stay/.test(location.search)) {
  var langs = (navigator.language || "en") + ","
            + (navigator.languages || []).join(",");
  location.replace(langs.toLowerCase().indexOf("zh") === 0 ||
                   langs.indexOf(",zh") >= 0 ? "zh/index.html"
                                             : "en/index.html");
}
</script>
<style>
body { font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
       max-width: 40em; margin: 8em auto; padding: 0 1em;
       color: #202124; }
h1 { font-size: 2em; }
ul { list-style: none; padding: 0; }
li { margin: 1em 0; }
a { display: block; padding: 1em 1.5em; border: 1px solid #d0d0d0;
    border-radius: 6px; text-decoration: none; color: #1565c0;
    font-size: 1.2em; }
a:hover { background: #f5f5f5; }
</style>
</head>
<body>
<h1>NLang Documentation</h1>
<ul>
<li><a href="zh/index.html">中文文档</a></li>
<li><a href="en/index.html">English Documentation</a></li>
</ul>
</body>
</html>
